# Docker Compose 部署：tunnel-client（+ 可选容器内 MCP server）
#
# 两种模式，靠 .env 切换，compose 文件不用改：
#
#   【stdio 模式】MCP server 与 tunnel-client 同容器（默认）
#       MCP_COMMAND=node /app/server.js
#       → run_command 执行**容器内** shell，宿主文件靠 volume 挂载
#
#   【windows 模式】MCP server 跑在 Windows 宿主，容器只做隧道
#       MCP_COMMAND=                                     ← 必须留空，否则报 duplicate channel "main"
#       MCP_SERVER_URL=http://host.docker.internal:18090/t/<token>/mcp
#       → run_powershell / run_cmd 执行**真实 Windows** 命令
#       详见 ../windows/README.md
#
# 快速开始
#   1) cp .env.example .env，填 CONTROL_PLANE_TUNNEL_ID
#   2) printf '%s\n' 'sk-你的RuntimeAPIKey' > secrets/control-plane.key && chmod 600 secrets/control-plane.key
#   3) docker compose up -d --build
#   4) docker compose logs -f tunnel          # 看它有没有连上控制面
#   5) curl -fsS http://127.0.0.1:18080/readyz
#
# 端口说明
#   容器内固定 8080。宿主侧默认 18080 —— 因为宿主 8080 已被
#   cdj-local-deploy-public-api-1 占用（不是 Docker Desktop 自己）。
#   只绑 127.0.0.1：官方明确提醒健康端口不要暴露到非可信网络。
#
# 顺手一提：健康端口除了 /readyz 还挂了内置 Web UI（/ui）和 /metrics，
# 想看运行态就把 18080 转出来访问 http://localhost:18080/ui

name: remote-mcp-tunnel

services:
  tunnel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TUNNEL_IMAGE: ${TUNNEL_IMAGE:-ghcr.io/openai/tunnel-client:v0.0.14}
    image: remote-mcp-tunnel:local
    container_name: remote-mcp-tunnel
    restart: unless-stopped

    # Docker Desktop 自带 host.docker.internal（解析到 192.168.65.254），不用管。
    # 换成原生 Linux 宿主（VPS）时才需要下面这行 —— 注意它会把解析结果变成 IPv6，
    # 所以 MCP server 必须监听双栈（windows/server.js 默认就是 ::）。
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    environment:
      # —— 控制面 ——
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?未设置 CONTROL_PLANE_TUNNEL_ID，先照 .env.example 建 .env}
      # 指向自建中继时改这里，默认就是 OpenAI 官方控制面
      CONTROL_PLANE_BASE_URL: ${CONTROL_PLANE_BASE_URL:-https://api.openai.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-struct-text}

      # —— 健康检查 ——
      HEALTH_LISTEN_ADDR: ":8080"

      # —— MCP 目标（二选一）——
      # 用 `-` 而不是 `:-`：空字符串要能原样传进去，否则切不到 windows 模式。
      # 空值会被 tunnel-client 当作"未设置"，实测有效。
      MCP_COMMAND: ${MCP_COMMAND-node /app/server.js}
      MCP_SERVER_URL: ${MCP_SERVER_URL-}

      # 下面两个只对容器内那个 MCP server 有意义（stdio 模式）
      MCP_SHELL: /bin/bash
      MCP_SCOPE: container

    # api key 走文件引用：不出现在环境变量里，也不在 docker inspect 的明文里
    command:
      - --control-plane.api-key
      - file:/run/secrets/control_plane_key
      - --allow-remote-ui

    secrets:
      - control_plane_key

    ports:
      - "127.0.0.1:${HEALTH_PORT:-18080}:8080"

    volumes:
      # 只在 stdio 模式下有用（windows 模式下容器里不跑 MCP server）。
      # 左边是宿主路径，右边是容器内挂载点。不想要宿主访问就整段删掉。
      - ${HOST_WORKSPACE:-/mnt/c/Users/longyuan/workspace}:/host/workspace
      - ${HOST_HOME:-/root}:/host/wsl-home

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  control_plane_key:
    file: ./secrets/control-plane.key
