name: relay image

# 构建 relay 中继镜像并推到 GHCR。
#
# 为什么放在 CI 而不是本地手工 docker push：
#   1. 本地 gh token 需要 write:packages 权限，而 GITHUB_TOKEN 自带 packages:write，
#      不需要任何人去点授权；
#   2. 镜像与源码的对应关系是可验证的 —— 每次 main 上的改动都会重出镜像，
#      不会出现"镜像比源码旧、但没人知道旧多少"；
#   3. 构建环境可复现，本地是 Windows/Docker Desktop，CI 是干净的 linux/amd64。
#
# 产出的包默认是**私有**的，即使仓库是公开的 —— 首次推送后需要到
# Packages → 该包 → Package settings → Change visibility 改成 Public。

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/relay-image.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/remote-mcp-relay

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildx 才能用到 GHA 缓存；纯 docker build 每次都从头拉 base image。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签策略：latest 只在默认分支上打，避免某个 tag 构建把 latest 顶掉。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: relay
          file: relay/Dockerfile
          # 部署目标是 linux/amd64 的 VPS。不做多架构：arm64 要走 QEMU 模拟，
          # 构建时间翻几倍，而当前没有任何 arm 部署目标。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把镜像摘要写进 job summary，便于"这张镜像到底对应哪个提交"的取证。
      - run: |
          {
            echo '### relay 镜像已推送'
            echo ''
            echo '| 项 | 值 |'
            echo '|---|---|'
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 标签 | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| 摘要 | \`${{ steps.meta.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
